name: email_auto_mobile
description: "RecruitMail Automator - Flutter mobile app for automated job applications & email outreach"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.2
  mailer: ^6.1.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  webview_flutter: ^4.10.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/resumes/
